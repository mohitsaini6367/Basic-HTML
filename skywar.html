
<!DOCTYPE html>
<html>
<head>
    <title>Skywar Fighting Game</title>

    <style>
        /* Main page */
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: red;
            text-shadow: 0 0 15px red;
        }

        /* Game screen */
        canvas {
            background: #111;
            border: 3px solid lime;
            display: block;
            margin: auto;
            max-width: 95%;
        }

        /* Game buttons */
        button {
            background: red;
            color: white;
            border: 2px solid white;
            padding: 12px 20px;
            margin: 8px;
            border-radius: 8px;
            font-size: 17px;
        }

        button:active {
            background: green;
        }

        #score {
            color: lime;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- Game title -->
    <h1>SKYWAR BATTLE</h1>

    <!-- Score display -->
    <p id="score">Score: 0 | Health: 100</p>

    <!-- Game canvas -->
    <canvas id="game" width="350" height="500"></canvas>

    <!-- Mobile controls -->
    <div>
        <button id="left">◀ LEFT</button>
        <button id="shoot">FIRE 🔥</button>
        <button id="right">RIGHT ▶</button>
    </div>

    <button onclick="restartGame()">RESTART GAME</button>

    <script>

        // Get canvas and drawing tools
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        // Game variables
        let score = 0;
        let health = 100;
        let gameOver = false;

        // Player spaceship
        let player = {
            x: 155,
            y: 430,
            width: 40,
            height: 40,
            speed: 5
        };

        // Bullets and enemies
        let bullets = [];
        let enemies = [];

        // Keyboard controls
        let keys = {};

        document.addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;

            if (e.code === "Space") {
                e.preventDefault();
                shootBullet();
            }
        });

        document.addEventListener("keyup", e => {
            keys[e.key.toLowerCase()] = false;
        });

        // Mobile button controls
        function holdButton(id, key) {
            const btn = document.getElementById(id);

            btn.addEventListener("pointerdown", e => {
                e.preventDefault();
                keys[key] = true;
            });

            ["pointerup", "pointerleave", "pointercancel"]
                .forEach(event => {
                    btn.addEventListener(event, () => {
                        keys[key] = false;
                    });
                });
        }

        holdButton("left", "arrowleft");
        holdButton("right", "arrowright");

        document.getElementById("shoot").addEventListener(
            "pointerdown", shootBullet
        );

        // Shoot bullets
        function shootBullet() {
            if (gameOver) return;

            bullets.push({
                x: player.x + 17,
                y: player.y,
                speed: 7
            });
        }

        // Create enemy spaceships
        function createEnemy() {
            if (gameOver) return;

            enemies.push({
                x: Math.random() * 310,
                y: -40,
                width: 35,
                height: 35,
                speed: 2 + Math.random() * 2
            });
        }

        // Draw player spaceship
        function drawPlayer() {
            ctx.fillStyle = "lime";

            ctx.beginPath();
            ctx.moveTo(player.x + 20, player.y);
            ctx.lineTo(player.x, player.y + 40);
            ctx.lineTo(player.x + 40, player.y + 40);
            ctx.closePath();
            ctx.fill();
        }

        // Draw enemies
        function drawEnemies() {
            ctx.fillStyle = "red";

            enemies.forEach(enemy => {
                ctx.fillRect(
                    enemy.x,
                    enemy.y,
                    enemy.width,
                    enemy.height
                );

                ctx.fillStyle = "white";
                ctx.fillRect(enemy.x + 8, enemy.y + 10, 6, 6);
                ctx.fillRect(enemy.x + 22, enemy.y + 10, 6, 6);
                ctx.fillStyle = "red";
            });
        }

        // Move bullets
        function moveBullets() {
            bullets.forEach(bullet => {
                bullet.y -= bullet.speed;

                ctx.fillStyle = "lime";
                ctx.fillRect(bullet.x, bullet.y, 6, 15);
            });

            bullets = bullets.filter(b => b.y > 0);
        }

        // Move enemies
        function moveEnemies() {
            enemies.forEach(enemy => {
                enemy.y += enemy.speed;

                // Check collision with player
                if (
                    enemy.x < player.x + player.width &&
                    enemy.x + enemy.width > player.x &&
                    enemy.y < player.y + player.height &&
                    enemy.y + enemy.height > player.y
                ) {
                    health -= 20;
                    enemy.y = 600;
                }

                // Enemy escapes
                if (enemy.y > 500) {
                    health -= 10;
                    enemy.y = 600;
                }
            });

            enemies = enemies.filter(e => e.y < 550);
        }

        // Bullet hits enemy
        function checkCollision() {
            bullets.forEach((bullet, bi) => {
                enemies.forEach((enemy, ei) => {

                    if (
                        bullet.x < enemy.x + enemy.width &&
                        bullet.x + 6 > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + 15 > enemy.y
                    ) {
                        enemy.y = 600;
                        bullet.y = -50;
                        score += 10;
                    }

                });
            });
        }

        // Main game loop
        function gameLoop() {

            ctx.clearRect(0, 0, 350, 500);

            if (gameOver) {
                ctx.fillStyle = "red";
                ctx.font = "35px Arial";
                ctx.fillText("GAME OVER", 65, 230);

                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.fillText("Score: " + score, 125, 270);
                return;
            }

            // Player movement
            if (keys["arrowleft"] || keys["a"]) {
                player.x -= player.speed;
            }

            if (keys["arrowright"] || keys["d"]) {
                player.x += player.speed;
            }

            // Keep player inside screen
            player.x = Math.max(0, Math.min(310, player.x));

            // Draw game objects
            drawPlayer();
            drawEnemies();
            moveBullets();
            moveEnemies();
            checkCollision();

            // Update score
            document.getElementById("score").innerText =
                "Score: " + score + " | Health: " + health;

            // Game over condition
            if (health <= 0) {
                gameOver = true;
            }

            requestAnimationFrame(gameLoop);
        }

        // Spawn enemies every second
        let enemyTimer = setInterval(createEnemy, 1000);

        // Restart game
        function restartGame() {
            score = 0;
            health = 100;
            gameOver = false;

            player.x = 155;
            bullets = [];
            enemies = [];

            gameLoop();
        }

        // Start game
        gameLoop();

    </script>

</body>
</html>
